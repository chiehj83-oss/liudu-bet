<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六都酒注 2026・快速下注</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1c2c; --bg2:#29366f; --panel:#333c57; --ink:#f4f4f4; --mute:#94b0c2;
  --gold:#ffcd75; --orange:#ef7d57; --red:#b13e53; --green:#a7f070; --teal:#38b764; --dark:#0d0e17;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DotGothic16","Noto Sans TC",monospace;font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:100% 4px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:14px 16px 28px}
svg.px{image-rendering:pixelated;shape-rendering:crispEdges;display:block}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.back{background:none;border:0;color:var(--mute);font:inherit;font-size:16px;padding:8px 2px;cursor:pointer}
.back[hidden]{display:block;visibility:hidden}
.prog{flex:1;height:14px;background:var(--dark);border:3px solid var(--ink);padding:1px;display:flex;gap:2px}
.prog[hidden]{display:flex;visibility:hidden}
.prog i{flex:1;background:transparent}
.prog i.on{background:var(--green)}
.step{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--gold);min-width:52px;text-align:right}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0}
.hero{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-bottom:14px}
.bob{animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
h1{font-family:"DotGothic16",monospace;font-size:46px;line-height:1.1;margin:0;text-align:center;color:var(--gold);text-shadow:4px 4px 0 var(--red)}
.sub{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--mute);text-align:center;margin:10px 0 20px;letter-spacing:1px}
.lead{text-align:center;margin:0 0 18px}
.box{background:var(--panel);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--dark);padding:14px}
.cityhead{display:flex;align-items:flex-end;gap:12px;margin-bottom:6px}
.city{font-size:40px;line-height:1;margin:0;color:var(--gold);text-shadow:3px 3px 0 var(--red)}
.q{font-size:21px;margin:10px 0 18px}
.q .pick{color:var(--green)}
.opts{display:grid;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--panel);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--dark);color:var(--ink);padding:12px 14px;font:inherit;font-size:21px;cursor:pointer;text-align:left;min-height:58px}
.opt small{font-size:13px;color:var(--mute)}
.opt:hover{background:var(--bg2)}
.opt:active{transform:translate(4px,4px);box-shadow:none}
.opt .cur{color:var(--gold);visibility:hidden;font-family:"Press Start 2P",monospace;font-size:12px}
.opt:hover .cur,.opt.sel .cur{visibility:visible}
.opt.sel{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.opt.sel small{color:var(--red)}
.opt.sel .cur{color:var(--red)}
.opt.skip{background:transparent;border-style:dashed;box-shadow:none;color:var(--mute);font-size:17px}
.cups{grid-template-columns:repeat(3,1fr)}
.cups .opt{flex-direction:column;justify-content:flex-end;align-items:center;min-height:150px;padding:10px 4px;gap:6px}
.cups .opt .num{font-family:"Press Start 2P",monospace;font-size:22px}
.mugs{display:flex;gap:2px;align-items:flex-end;min-height:48px}
input{width:100%;background:var(--dark);color:var(--ink);border:4px solid var(--ink);padding:14px;font:inherit;font-size:20px;border-radius:0}
input::placeholder{color:#566c86}
input:focus,button:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.go{display:block;width:100%;background:var(--red);color:var(--ink);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--dark);padding:14px;font:inherit;font-size:21px;cursor:pointer;margin-top:16px}
.go:active{transform:translate(6px,6px);box-shadow:none}
.go:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:6px 6px 0 var(--dark)}
.go.alt{background:var(--teal)}
.go.ghost{background:transparent;box-shadow:none}
details{margin-top:24px;font-size:16px}
summary{cursor:pointer;color:var(--gold);list-style:none}
summary::-webkit-details-marker{display:none}
details ol{padding-left:22px;margin:10px 0 0} details li{margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:3px dotted #566c86;font-size:19px}
.row:last-child{border-bottom:0}
.row .dim{color:var(--mute)}
.row b{color:var(--gold);font-weight:normal}
.warn{color:var(--orange);margin:14px 0 0;font-size:16px}
.note{font-size:14px;color:var(--mute);margin-top:14px;text-align:center}
.skyline{margin:22px auto 0;opacity:.9}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--gold);color:var(--dark);border:4px solid var(--dark);padding:10px 16px;font-size:17px;opacity:0;transition:opacity .15s steps(2);pointer-events:none}
.toast.on{opacity:1}
textarea{width:100%;height:190px;margin-top:12px;background:var(--dark);color:var(--ink);border:4px solid var(--ink);padding:10px;font:inherit;font-size:16px;border-radius:0}
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
th,td{padding:7px 8px;border-bottom:3px dotted #566c86;text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:normal;font-size:13px}
td.n{text-align:right}
.hit{color:var(--green)} .miss{color:var(--orange)} .dim{color:var(--mute)}
.tag{display:inline-block;background:var(--gold);color:var(--dark);padding:0 5px;font-size:12px;margin-left:6px}
h2{font-size:22px;color:var(--gold);margin:26px 0 6px}
.linkbtn{background:none;border:0;color:var(--gold);font:inherit;font-size:17px;text-decoration:underline;cursor:pointer;display:block;margin:16px auto 0}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:6px}
.namebtn{background:var(--panel);color:var(--ink);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--dark);font:inherit;font-size:19px;padding:10px 6px;cursor:pointer}
.namebtn.sel{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.namebtn:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through;box-shadow:none}
.label{font-size:15px;color:var(--mute);margin:14px 0 6px}
.music{background:none;border:3px solid var(--mute);color:var(--mute);font-family:"Press Start 2P",monospace;font-size:10px;padding:6px 7px;cursor:pointer;margin-left:6px}
.music.on{border-color:var(--green);color:var(--green)}
.wm{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-18deg);font-family:"Press Start 2P",monospace;font-size:64px;color:rgba(255,205,117,.05);letter-spacing:4px;pointer-events:none;z-index:0;white-space:nowrap;user-select:none}
.wm[hidden]{display:none}
.app{position:relative;z-index:1}
.sign{font-family:"Press Start 2P",monospace;font-size:9px;color:#566c86;text-align:center;margin-top:22px;letter-spacing:2px}
.lobby{position:relative;height:170px;margin:4px -16px 18px;overflow:hidden;border-top:4px solid var(--ink);border-bottom:4px solid var(--ink);background:#14152a}
.floor{position:absolute;left:0;right:0;bottom:0;height:78px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(3,1fr);gap:2px;padding:2px;background:#0d0e17}
.floor i{animation:disco 2.4s steps(1) infinite;opacity:.85}
@keyframes disco{0%{background:#b13e53}25%{background:#3b5dc9}50%{background:#38b764}75%{background:#5d275d}}
.ball{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:2}
.beam{position:absolute;top:30px;width:3px;height:3px;background:#f4f4f4;box-shadow:0 0 6px #fff;animation:beam 1.6s steps(4) infinite;z-index:1}
@keyframes beam{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.lobby .empty{position:absolute;left:0;right:0;top:44px;text-align:center;color:var(--mute);font-size:15px;z-index:3}
.lobby .tag2{position:absolute;top:6px;left:10px;font-family:"Press Start 2P",monospace;font-size:8px;color:var(--gold);z-index:3}
.walker{position:absolute;bottom:10px;width:39px;will-change:transform}
.walker .nm{position:absolute;bottom:44px;left:15px;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:var(--ink);background:rgba(13,14,23,.75);padding:0 4px;line-height:1.4}
.walker.me .nm{color:var(--dark);background:var(--gold)}
.walker svg{display:block}
.city2{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px;color:var(--gold);font-size:19px}
.city2 small{color:var(--mute);font-size:13px}
.tl{display:grid;grid-template-columns:5.5em 1fr auto;align-items:center;gap:8px;margin:5px 0;font-size:16px}
.tl .bar{height:14px;background:var(--dark);border:2px solid #566c86}
.tl .bar i{display:block;height:100%;background:var(--teal)}
.tl.top .bar i{background:var(--gold)}
.tl .ct{font-size:13px;color:var(--mute);white-space:nowrap}
.fav{display:inline-block;background:var(--gold);color:var(--dark);font-size:11px;padding:0 4px;margin-left:4px}
.sponsor{text-align:center;margin-top:18px;font-size:14px;color:var(--mute)}
.sponsor b{font-family:"Press Start 2P",monospace;font-size:13px;color:var(--gold);font-weight:normal;letter-spacing:2px;text-shadow:2px 2px 0 var(--red)}
.howto{border:3px dashed #566c86;padding:10px 12px;margin-top:18px;font-size:15px;line-height:1.6}
.howto b{color:var(--gold);font-weight:normal}
.press{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--gold);text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wm" id="wm" aria-hidden="true">ICEJACK</div>
<div class="app">
  <div class="top">
    <button class="back" id="back" hidden>◀ 上一題</button>
    <div class="prog" id="progwrap" hidden></div>
    <span class="step" id="step"></span>
    <button class="music" id="music" aria-label="背景音樂開關">♪ OFF</button>
  </div>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- pixel sprites: each char is a color key ---------- */
const PAL = {k:"#0d0e17",w:"#f4f4f4",g:"#94b0c2",s:"#566c86",y:"#ffcd75",o:"#ef7d57",r:"#b13e53",l:"#a7f070",t:"#38b764",b:"#3b5dc9",c:"#41a6f6",n:"#29366f",d:"#333c57",m:"#5d275d",f:"#ffe9b0"};
const SPR = {
  ballot:[
    "....kkkkkk......",
    "....kwwwwk......",
    "....kwrrwk......",
    "....kwrwrk......",
    "....kwrrwk......",
    "..kkkkwwkkkkkk..",
    "..kccccwwccccck.",
    ".kkkkkkkkkkkkkk.",
    ".kbbbbbbbbbbbbk.",
    ".kbbbbkkkkbbbbk.",
    ".kbbbkwwwwkbbbk.",
    ".kbbbkwyywkbbbk.",
    ".kbbbkwwwwkbbbk.",
    ".kbbbbkkkkbbbbk.",
    ".knnnnnnnnnnnnk.",
    ".kkkkkkkkkkkkkk."],
  mug:[
    "..wwwwwwww....",
    ".wwwwwwwwww...",
    ".kkkkkkkkkk...",
    ".kyyyyyyyyk...",
    ".kyfyyyyyykkk.",
    ".kyfyyyyyyk.k.",
    ".kyyyyyfyyk.k.",
    ".kyyyyyyyyk.k.",
    ".kyfyyyyyykkk.",
    ".kyyyyyfyyk...",
    ".kyyyyyyyyk...",
    ".kkkkkkkkkk..."],
  stamp:[
    "....kkkkk....",
    "....koook....",
    "....koook....",
    "...kkkkkkk...",
    "...krrrrrk...",
    "..kkkkkkkkk..",
    "..kmmmmmmmk..",
    "..kkkkkkkkk..",
    ".............",
    "...rrrrrrr...",
    "..rr..r..rr..",
    "..r.rrrrr.r..",
    "..rr..r..rr..",
    "...rrrrrrr..."],
  mega:[
    "..........kk..",
    "........kkwk..",
    "......kkwwwk..",
    "kkkkkkwwwwwk..",
    "kookkwwwwwwk.y",
    "kookkwwwwwwk..",
    "kookkwwwwwwky.",
    "kkkkkkwwwwwk..",
    "..kk..kkwwwk.y",
    "..kk....kkwk..",
    "..kkk.....kk.."],
  trophy:[
    "..kkkkkkkkkk..",
    "kkkyyyyyyyykkk",
    "kyky fyyyyykyk".replace(" ","y"),
    "kyky fyyyyykyk".replace(" ","y"),
    ".kkyfyyyyyykk.",
    "...kyyyyyyk...",
    "....kyyyyk....",
    ".....kyyk.....",
    ".....kyyk.....",
    "....kkyykk....",
    "...koooooook..".slice(0,14),
    "...kkkkkkkk..."],
  arrow:[
    "k...",
    "kk..",
    "kyk.",
    "kyyk",
    "kyk.",
    "kk..",
    "k..."]
};
function sprite(name, scale, cls){
  const rows = SPR[name], h = rows.length, w = Math.max(...rows.map(r => r.length));
  let rects = "";
  rows.forEach((row,y) => { for (let x = 0; x < row.length; x++) { const c = PAL[row[x]]; if (c) rects += '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+c+'"/>'; } });
  return '<svg class="px '+(cls||"")+'" viewBox="0 0 '+w+' '+h+'" width="'+w*scale+'" height="'+h*scale+'" aria-hidden="true">'+rects+'</svg>';
}
/* skyline per city: simple generic building profiles (height per column) */
const SKY = {
  "台北市":[3,3,5,5,4,4,6,6,9,12,16,16,12,9,6,6,4,4,5,5,7,7,3,3],
  "新北市":[4,4,6,6,6,5,5,7,7,7,9,9,9,6,6,8,8,4,4,6,6,6,3,3],
  "桃園市":[3,3,3,5,5,4,4,4,7,7,6,6,2,2,3,8,8,8,5,5,4,4,3,3],
  "台中市":[3,4,4,6,6,6,8,8,10,10,10,7,7,5,5,9,9,6,6,4,4,4,3,3],
  "台南市":[2,2,4,4,4,6,7,7,6,4,4,3,3,5,5,5,8,9,8,5,5,3,2,2],
  "高雄市":[3,3,5,5,7,7,9,11,13,15,15,13,11,9,7,7,5,5,6,6,4,4,3,3]
};
function skyline(name, scale){
  const hs = SKY[name] || SKY["台北市"], H = 18, W = hs.length;
  let r = "";
  hs.forEach((h,x) => {
    for (let y = H - h; y < H; y++) {
      const win = (x % 2 === 1) && (y % 3 === 1) && y < H - 1 && ((x * 7 + y * 3) % 5 !== 0);
      r += '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+(win ? "#ffcd75" : (y === H - h ? "#566c86" : "#29366f"))+'"/>';
    }
  });
  return '<svg class="px skyline" viewBox="0 0 '+W+' '+H+'" width="'+W*scale+'" height="'+H*scale+'" aria-hidden="true">'+r+'</svg>';
}

/* ---------- data ---------- */
const CITIES = [
  {name:"台北市", c:[["蔣萬安","國民黨・現任"],["沈伯洋","民進黨"],["郭璽","台灣麻將最大黨"],["蕭文乾","臺灣SoR無法黨"],["唐新民","三勢團結促進聯盟"],["林志成","無黨籍"]]},
  {name:"新北市", c:[["李四川","國民黨"],["蘇巧慧","民進黨"],["蘇輝湟","無黨籍"]]},
  {name:"桃園市", c:[["張善政","國民黨・現任"],["黃世杰","民進黨"]]},
  {name:"台中市", c:[["江啟臣","國民黨"],["何欣純","民進黨"],["洪麗華","司法正義黨"]]},
  {name:"台南市", c:[["謝龍介","國民黨"],["陳亭妃","民進黨"],["葉人文","無黨籍"],["蕭燐洪","臺灣SoR無法黨"]]},
  {name:"高雄市", c:[["柯志恩","國民黨"],["賴瑞隆","民進黨"],["張靜","司法改革黨"],["王肇民","無黨籍"],["洪方隆","無黨籍"]]}
];
const CUPNOTE = {1:"小試一下",2:"有點把握",3:"穩了"};
const DEADLINE = new Date("2026-11-28T08:00:00+08:00").getTime();
const TOTAL = 12;
const API = "https://script.google.com/macros/s/AKfycbzVu-3dx_Y5H21-ENjoAvboc0B-DvN6th04IjROIbPWNwjLQcxbw4FpqOOZ2bhioLtWvw/exec";
const BOARD = 99;
let sending = false, sendMsg = "", data = null, loadErr = "";
let info = null, infoFailed = false;
let pass = (() => { try { return localStorage.getItem("liudu_pass") || ""; } catch (_) { return ""; } })();
async function loadInfo(){
  try { const r = await fetch(API, {credentials:"omit"}); info = await r.json(); data = info; syncWalkers(); }
  catch (_) { infoFailed = true; }
  if (q === -1) render();
}

function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (_) { return null; } }
function deviceKey(){
  let k = store("liudu_key");
  if (!k || !/^[A-Za-z0-9]{12,64}$/.test(k)) {
    const a = new Uint8Array(16); crypto.getRandomValues(a);
    k = [...a].map(x => x.toString(36).padStart(2,"0")).join("").replace(/[^A-Za-z0-9]/g,"").slice(0,24);
    store("liudu_key", k);
  }
  return k;
}
async function loadBoard(){
  loadErr = "";
  try {
    const r = await fetch(API, {credentials:"omit"});
    data = await r.json(); info = data; syncWalkers();
  } catch (_) { loadErr = "讀不到資料，請稍後重新整理。"; }
  if (q === BOARD) render();
}

let nick = store("liudu_nick") || "";
let picks = (() => { try { const p = JSON.parse(store("liudu_picks")); if (Array.isArray(p) && p.length === 6) return p; } catch (_) {} return CITIES.map(() => ({c:null, n:null})); })();
const sentBefore = !!store("liudu_sent");
let q = -1, history = [];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

$("progwrap").innerHTML = "<i></i>".repeat(TOTAL);

function go(next, push = true){ if (push) history.push(q); q = next; render(); window.scrollTo(0,0); }
function nextAfter(i){ return (i % 2 === 0 && picks[i/2].c === "不押") ? i + 2 : i + 1; }

function render(){
  const m = $("main"), inQuiz = q >= 0 && q < TOTAL;
  $("back").hidden = q < 0;
  $("wm").hidden = q !== -1;
  $("progwrap").hidden = q < 0 || q === BOARD;
  [...$("progwrap").children].forEach((el,i) => el.classList.toggle("on", i < Math.min(q, TOTAL)));
  $("step").textContent = inQuiz ? String(q + 1).padStart(2,"0") + "/" + TOTAL : (q === BOARD ? "" : q >= TOTAL ? "CLEAR" : "");

  if (q === -1) {
    const closed = Date.now() >= DEADLINE;
    m.innerHTML =
      '<div class="hero">' + sprite("mega",4,"") + sprite("ballot",6,"bob") + sprite("mug",4,"") + '</div>' +
      '<h1>六都酒注</h1><p class="sub">ELECTION 2026 · 11.28</p>' +
      '<p class="lead">押六都市長，賭注是酒<br>按 12 下就完成</p>' +
      lobbyHTML() +
      (closed || (info && info.closed) ? '<p class="warn">▶ 下注已截止或暫停中，等開票吧。</p>' :
      (!info && !infoFailed ? '<p class="lead">NOW LOADING<span class="blink">…</span></p>' :
      (info && info.players && info.players.length ?
        '<p class="label">點你的名字：</p><div class="names">' + info.players.map(p => {
          const mine = p.name === (store("liudu_nick") || "");
          return '<button class="namebtn' + (nick === p.name ? " sel" : "") + '" data-name="' + esc(p.name) + '"' + (p.taken && !mine ? " disabled" : "") + '>' + esc(p.name) + '</button>';
        }).join("") + '</div><p class="note" style="margin-top:4px">劃掉的名字已經被登記。名單上沒有你？找主辦人。</p>'
      : '<input id="nick" maxlength="20" placeholder="大家認得出來的名字，例：業務部阿明" value="' + esc(nick) + '" autocomplete="nickname"><p class="note" style="margin-top:6px">請寫群組認得出是誰的名字，認不出來的注單主辦人會刪除。</p>') +
      (info && info.needPass ? '<p class="label">群組通關碼：</p><input id="pass" maxlength="30" placeholder="跟主辦人要" value="' + esc(pass) + '">' : '') +
      '<button class="go" id="start"' + (nick.trim() ? "" : " disabled") + '>▶ START</button>' +

function openBoard(){ data = null; go(BOARD); loadBoard(); }

function settle(bets, winners){
  const decided = winners.filter(Boolean).length;
  const rows = bets.filter(b => b.picks.filter(p => p.c !== "不押").length >= 3).map(b => {
    let hit = 0, pen = 0, tix = 0;
    const full = b.picks.every(p => p.c !== "不押");
    b.picks.forEach((p,i) => { if (p.c === "不押" || !winners[i]) return; if (p.c === winners[i]) { hit++; tix += p.n; } else pen += p.n; });
    return {nick:b.nick, hit, pen, tix, god: decided === 6 && full && hit === 6, zero: decided === 6 && full && hit === 0};
  });
  const gods = rows.filter(r => r.god).length;
  rows.forEach(r => { if (r.zero) r.pen += 1; r.toast = gods - (r.god ? 1 : 0); r.drink = Math.max(0, r.pen - r.tix) + r.toast; });
  rows.sort((a,b) => b.hit - a.hit || a.drink - b.drink);
  return {rows, decided, gods};
}

}
function lobbyHTML(){
  const head = '<div class="lobby" id="lobby">' + floorHTML() + '<span class="tag2">DANCE FLOOR' + (walkers.length ? ' · ' + walkers.length : '') + '</span>';
  if (!info) return head + '</div>';
  const me = (store("liudu_nick") || "").trim();
  if (!walkers.length) return head + '<div class="empty">舞池還沒有人，送出注單就能進場跳舞 🍺</div></div>';
  return head + walkers.map((w,i) =>
    '<div class="walker' + (w.nick === me ? " me" : "") + '" data-i="' + i + '" style="bottom:' + w.y.toFixed(0) + 'px;z-index:' + (10 + Math.round(60 - w.y)) + '"><span class="nm">' + esc(w.nick) + '</span><span class="fa">' + personSVG(BODY_A, w.nick) + '</span><span class="fb" style="display:none">' + personSVG(BODY_B, w.nick) + '</span></div>').join("") + '</div>';
}
function tickLobby(t){
  const box = $("lobby");
  if (!box) { lobbyRAF = 0; return; }
  const dt = Math.min(0.05, (t - (lastT || t)) / 1000); lastT = t;
  const W = box.clientWidth - 39;
  box.querySelectorAll(".walker").forEach(el => {
    const w = walkers[+el.dataset.i]; if (!w) return;
    if (w.pause > 0) { w.pause -= dt; w.ft += dt; if (w.ft > 0.18) { w.ft = 0; w.frame ^= 1; w.hop = w.frame ? -3 : 0; } }
    else {
      w.x += w.v * dt;
      if (w.x < 0) { w.x = 0; w.v = Math.abs(w.v); }
      if (w.x > W) { w.x = W; w.v = -Math.abs(w.v); }
      w.ft += dt; if (w.ft > 0.22) { w.ft = 0; w.frame ^= 1; }
      w.hop = 0;
      if (Math.random() < dt * 0.3) w.pause = 0.8 + Math.random() * 2.5;
      if (Math.random() < dt * 0.08) w.v = -w.v;
    }
    el.style.transform = "translate(" + w.x.toFixed(1) + "px," + w.hop + "px)";
    el.querySelector(".fa").style.display = w.frame ? "none" : "";
    el.querySelector(".fb").style.display = w.frame ? "" : "none";
    const svgs = el.querySelectorAll("svg"); svgs.forEach(sv => sv.style.transform = w.v < 0 ? "scaleX(-1)" : "");
  });
  lobbyRAF = requestAnimationFrame(tickLobby);
}
function startLobby(){ if (!lobbyRAF) { lastT = 0; lobbyRAF = requestAnimationFrame(tickLobby); } }
function toast(s){ const el = $("toast"); el.textContent = s; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }

document.addEventListener("click", e => {
  const b = e.target.closest(".opt");
  if (!b || q < 0 || q >= TOTAL) return;
  const ci = Math.floor(q / 2);
  if (b.dataset.c) { picks[ci].c = b.dataset.c; if (b.dataset.c === "不押") picks[ci].n = null; }
  else picks[ci].n = Number(b.dataset.n);
  b.classList.add("sel");
  sfx("coin");
  setTimeout(() => go(Math.min(nextAfter(q), TOTAL)), 180);
});
$("back").onclick = () => { q = history.length ? history.pop() : -1; if (q === BOARD && !data) loadBoard(); render(); };
render();
loadInfo();
</script>
