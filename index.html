<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六都預測 賭酒大賽 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1c2c; --bg2:#29366f; --panel:#333c57; --ink:#f4f4f4; --mute:#94b0c2;
  --gold:#ffcd75; --orange:#ef7d57; --red:#b13e53; --green:#a7f070; --teal:#38b764; --dark:#0d0e17;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DotGothic16","Noto Sans TC",monospace;font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:100% 4px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:14px 16px 28px}
svg.px{image-rendering:pixelated;shape-rendering:crispEdges;display:block}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.back{background:none;border:0;color:var(--mute);font:inherit;font-size:16px;padding:8px 2px;cursor:pointer}
.back[hidden]{display:block;visibility:hidden}
.prog{flex:1;height:14px;background:var(--dark);border:3px solid var(--ink);padding:1px;display:flex;gap:2px}
.prog[hidden]{display:flex;visibility:hidden}
.prog i{flex:1;background:transparent}
.prog i.on{background:var(--green)}
.step{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--gold);min-width:52px;text-align:right}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0}
.hero{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-bottom:14px}
.bob{animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
h1{font-family:"DotGothic16",monospace;font-size:46px;line-height:1.1;margin:0;text-align:center;color:var(--gold);text-shadow:4px 4px 0 var(--red)}
.sub{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--mute);text-align:center;margin:10px 0 20px;letter-spacing:1px}
.lead{text-align:center;margin:0 0 18px}
.box{background:var(--panel);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--dark);padding:14px}
.cityhead{display:flex;align-items:flex-end;gap:12px;margin-bottom:6px}
.city{font-size:40px;line-height:1;margin:0;color:var(--gold);text-shadow:3px 3px 0 var(--red)}
.q{font-size:21px;margin:10px 0 18px}
.q .pick{color:var(--green)}
.opts{display:grid;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:var(--panel);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--dark);color:var(--ink);padding:12px 14px;font:inherit;font-size:21px;cursor:pointer;text-align:left;min-height:58px}
.opt small{font-size:13px;color:var(--mute)}
.opt:hover{background:var(--bg2)}
.opt:active{transform:translate(4px,4px);box-shadow:none}
.opt .cur{color:var(--gold);visibility:hidden;font-family:"Press Start 2P",monospace;font-size:12px}
.opt:hover .cur,.opt.sel .cur{visibility:visible}
.opt.sel{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.opt.sel small{color:var(--red)}
.opt.sel .cur{color:var(--red)}
.opt.skip{background:transparent;border-style:dashed;box-shadow:none;color:var(--mute);font-size:17px}
.cups{grid-template-columns:repeat(3,1fr)}
.cups .opt{flex-direction:column;justify-content:flex-end;align-items:center;min-height:150px;padding:10px 4px;gap:6px}
.cups .opt .num{font-family:"Press Start 2P",monospace;font-size:22px}
.mugs{display:flex;gap:2px;align-items:flex-end;min-height:48px}
input{width:100%;background:var(--dark);color:var(--ink);border:4px solid var(--ink);padding:14px;font:inherit;font-size:20px;border-radius:0}
input::placeholder{color:#566c86}
input:focus,button:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.go{display:block;width:100%;background:var(--red);color:var(--ink);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--dark);padding:14px;font:inherit;font-size:21px;cursor:pointer;margin-top:16px}
.go:active{transform:translate(6px,6px);box-shadow:none}
.go:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:6px 6px 0 var(--dark)}
.go.alt{background:var(--teal)}
.go.ghost{background:transparent;box-shadow:none}
details{margin-top:24px;font-size:16px}
summary{cursor:pointer;color:var(--gold);list-style:none}
summary::-webkit-details-marker{display:none}
details ol{padding-left:22px;margin:10px 0 0} details li{margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:3px dotted #566c86;font-size:19px}
.row:last-child{border-bottom:0}
.row .dim{color:var(--mute)}
.row b{color:var(--gold);font-weight:normal}
.warn{color:var(--orange);margin:14px 0 0;font-size:16px}
.note{font-size:14px;color:var(--mute);margin-top:14px;text-align:center}
.skyline{margin:22px auto 0;opacity:.9}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--gold);color:var(--dark);border:4px solid var(--dark);padding:10px 16px;font-size:17px;opacity:0;transition:opacity .15s steps(2);pointer-events:none}
.toast.on{opacity:1}
textarea{width:100%;height:190px;margin-top:12px;background:var(--dark);color:var(--ink);border:4px solid var(--ink);padding:10px;font:inherit;font-size:16px;border-radius:0}
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
th,td{padding:7px 8px;border-bottom:3px dotted #566c86;text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:normal;font-size:13px}
td.n{text-align:right}
.hit{color:var(--green)} .miss{color:var(--orange)} .dim{color:var(--mute)}
.tag{display:inline-block;background:var(--gold);color:var(--dark);padding:0 5px;font-size:12px;margin-left:6px}
h2{font-size:22px;color:var(--gold);margin:26px 0 6px}
.linkbtn{background:none;border:0;color:var(--gold);font:inherit;font-size:17px;text-decoration:underline;cursor:pointer;display:block;margin:16px auto 0}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:6px}
.namebtn{background:var(--panel);color:var(--ink);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--dark);font:inherit;font-size:19px;padding:10px 6px;cursor:pointer}
.namebtn.sel{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.namebtn:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through;box-shadow:none}
.label{font-size:15px;color:var(--mute);margin:14px 0 6px}
.music{background:none;border:3px solid var(--mute);color:var(--mute);font-family:"Press Start 2P",monospace;font-size:10px;padding:6px 7px;cursor:pointer;margin-left:6px}
.music.on{border-color:var(--green);color:var(--green)}
.wm{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-18deg);font-family:"Press Start 2P",monospace;font-size:64px;color:rgba(255,205,117,.05);letter-spacing:4px;pointer-events:none;z-index:0;white-space:nowrap;user-select:none}
.wm[hidden]{display:none}
.app{position:relative;z-index:1}
.sign{font-family:"Press Start 2P",monospace;font-size:9px;color:#566c86;text-align:center;margin-top:22px;letter-spacing:2px}
.lobby{position:relative;height:170px;margin:4px -16px 18px;overflow:hidden;border-top:4px solid var(--ink);border-bottom:4px solid var(--ink);background:#14152a}
.floor{position:absolute;left:0;right:0;bottom:0;height:78px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(3,1fr);gap:2px;padding:2px;background:#0d0e17}
.floor i{animation:disco 2.4s steps(1) infinite;opacity:.85}
@keyframes disco{0%{background:#b13e53}25%{background:#3b5dc9}50%{background:#38b764}75%{background:#5d275d}}
.ball{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:2}
.beam{position:absolute;top:30px;width:3px;height:3px;background:#f4f4f4;box-shadow:0 0 6px #fff;animation:beam 1.6s steps(4) infinite;z-index:1}
@keyframes beam{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.lobby .empty{position:absolute;left:0;right:0;top:44px;text-align:center;color:var(--mute);font-size:15px;z-index:3}
.lobby .tag2{position:absolute;top:6px;left:10px;font-family:"Press Start 2P",monospace;font-size:8px;color:var(--gold);z-index:3}
.djz{position:absolute;top:0;right:0;width:32%;height:170px;background:radial-gradient(circle at 50% 100%,#5d275d,#1a1c2c 70%);border-left:3px dashed #566c86;border-bottom:3px dashed #566c86;z-index:2;overflow:hidden}
.djz b{position:absolute;top:6px;right:6px;font-size:11px;color:#ffcd75;background:#0d0e17;padding:1px 5px;border:2px solid #566c86}
.djz .dj{position:absolute;bottom:6px;left:50%;margin-left:-48px}.djz .dj1{visibility:hidden;animation:djb .9s steps(1) infinite}.djz .dj0{animation:djb .9s steps(1) infinite reverse}
@keyframes djb{0%{visibility:hidden}50%{visibility:visible}}
.djz i{position:absolute;bottom:60px;left:30%;font-style:normal;color:#73eff7;font-size:14px;animation:note 2.4s linear infinite}.djz i+i{left:55%;color:#ff77a8;animation-delay:-.8s}.djz i+i+i{left:75%;color:#ffcd75;animation-delay:-1.6s}
@keyframes note{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-70px) rotate(20deg);opacity:0}}
.smz{position:absolute;top:170px;bottom:150px;right:0;width:32%;background:repeating-linear-gradient(45deg,rgba(86,108,134,.28) 0 6px,rgba(51,60,87,.28) 6px 12px);border-left:3px dashed #566c86;z-index:2}
.walker.milky svg{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #73eff7)}
.yard{position:absolute;left:0;right:0;bottom:0;height:150px;display:flex;border-top:6px solid #566c86;z-index:2}
.yard>div{position:relative;flex:1}
.z-tree{background:repeating-linear-gradient(0deg,#a7f070 0 4px,#8fd65e 4px 8px)}
.z-milk{background:repeating-conic-gradient(#29366f 0 25%,#333c57 0 50%) 0 0/16px 16px;border-left:4px solid #566c86}
.yard b{position:absolute;top:6px;left:6px;font-size:11px;color:#f4f4f4;background:#0d0e17;padding:1px 5px;border:2px solid #566c86}
.yard .tree{position:absolute;bottom:92px;right:8px}.yard .tree+.tree{right:42px;bottom:100px}.yard .tree+.tree+.tree{right:76px;bottom:90px}
.yard .cow{position:absolute;bottom:96px;right:10px;filter:drop-shadow(0 0 0 #0d0e17) drop-shadow(1px 0 0 #566c86) drop-shadow(-1px 0 0 #566c86)}.yard .cow+.cow{right:58px;bottom:84px;transform:scaleX(-1)}
.smz b{position:absolute;top:6px;right:6px;font-size:11px;color:#c2c3c7;background:#0d0e17;padding:1px 5px;border:2px solid #566c86}
.puff{position:absolute;bottom:20px;left:36px;width:3px;height:3px;background:#c2c3c7;animation:puff 2.2s linear infinite}
.puff::after{content:"";position:absolute;left:2px;top:0;width:3px;height:3px;background:#94b0c2;animation:puff 2.2s linear infinite;animation-delay:-1.1s}
@keyframes puff{0%{transform:translate(0,0);opacity:.9}100%{transform:translate(4px,-26px) scale(2);opacity:0}}
.walker{position:absolute;bottom:10px;width:39px;will-change:transform;cursor:pointer}
.walker .say{position:absolute;bottom:70px;left:15px;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:#0d0e17;background:#f4f4f4;border:2px solid #0d0e17;padding:1px 6px;line-height:1.3;z-index:5}
.walker .say::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-3px;border:3px solid transparent;border-top-color:#0d0e17}
.walker .say.ch{background:#ffcd75;font-weight:bold}
.lobby.party .floor{animation:hue .8s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg) brightness(1.3)}}
.yard .tree{cursor:pointer;transform-origin:50% 100%;transition:transform .6s,opacity .6s}
.yard .tree.down{transform:rotate(86deg);opacity:.55}
.yard .tree.shake{animation:shk .25s linear}@keyframes shk{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.yard .cow{cursor:pointer}
.yard .moo{position:absolute;font-size:14px;font-weight:bold;color:#0d0e17;background:#f4f4f4;border:2px solid #0d0e17;padding:0 5px;z-index:9;animation:mooup 1.4s ease-out forwards}
@keyframes mooup{0%{transform:translateY(6px);opacity:0}20%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
.lhint{font-size:12px;color:#94b0c2;text-align:center;margin:6px 0 10px;line-height:1.6}.lhint b{color:#ffcd75;font-weight:normal}
.djz b,.smz b,.yard b{animation:tagGlint 7s infinite}
.smz b{animation-delay:1.7s}.yard .z-tree b{animation-delay:3.4s}.yard .z-milk b{animation-delay:5.1s}
@keyframes tagGlint{0%,86%,100%{background:#0d0e17;color:inherit;box-shadow:none}90%,95%{background:#ffcd75;color:#0d0e17;box-shadow:0 0 10px #ffcd75}}
.yard .z-milk .cow{animation:glint 7s infinite 5.4s}.yard .z-tree .tree:not(.down):not(.shake){animation:glint 7s infinite 3.7s}
.djz{animation:zoneGlint 7s infinite}
@keyframes glint{0%,86%,100%{filter:none}90%,95%{filter:drop-shadow(0 0 3px #ffcd75) drop-shadow(0 0 7px #ffcd75) brightness(1.3)}}
@keyframes zoneGlint{0%,86%,100%{box-shadow:none}90%,95%{box-shadow:inset 0 0 18px #ffcd75}}
.walker.me .fa svg,.walker.me .fb svg{animation:glint 4s infinite 2s}
.sayed{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center}
.sayed>div{background:#1a1c2c;border:3px solid #ffcd75;padding:16px;width:min(86vw,320px);text-align:center;color:#f4f4f4}
.sayed .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.sayed .chip{font:inherit;font-size:13px;background:#333c57;color:#f4f4f4;border:2px solid #566c86;padding:3px 8px;cursor:pointer}.sayed .chip.sel{background:#ffcd75;color:#0d0e17;border-color:#ffcd75}
.sayed input{width:100%;font-size:18px;padding:6px;margin:8px 0;box-sizing:border-box}
.walker .nm{position:absolute;bottom:50px;left:15px;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:var(--ink);background:rgba(13,14,23,.75);padding:0 4px;line-height:1.4}
.walker.me{z-index:999 !important}
.walker.me .nm{color:var(--dark);background:var(--gold);font-size:15px;padding:1px 6px;bottom:54px;box-shadow:0 0 0 2px var(--dark)}
.walker.me .nm::before{content:"▼ YOU";position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font-family:"Press Start 2P",monospace;font-size:8px;color:var(--gold);white-space:nowrap;margin-bottom:2px;animation:blink 1s steps(1) infinite}
tr.me td{background:rgba(255,205,117,.18)}
.walker svg{display:block}
.city2{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px;color:var(--gold);font-size:19px}
.city2 small{color:var(--mute);font-size:13px}
.tl{display:grid;grid-template-columns:5.5em 1fr auto;align-items:center;gap:8px;margin:5px 0;font-size:16px}
.tl .bar{height:14px;background:var(--dark);border:2px solid #566c86}
.tl .bar i{display:block;height:100%;background:var(--teal)}
.tl.top .bar i{background:var(--gold)}
.tl .ct{font-size:13px;color:var(--mute);white-space:nowrap}
.fav{display:inline-block;background:var(--gold);color:var(--dark);font-size:11px;padding:0 4px;margin-left:4px}
.sponsor{text-align:center;margin-top:18px;font-size:14px;color:var(--mute)}
.sponsor b{font-family:"Press Start 2P",monospace;font-size:13px;color:var(--gold);font-weight:normal;letter-spacing:2px;text-shadow:2px 2px 0 var(--red)}
.howto{border:3px dashed #566c86;padding:10px 12px;margin-top:18px;font-size:15px;line-height:1.6}
.howto b{color:var(--gold);font-weight:normal}
.looks{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.lookbtn{background:var(--panel);border:3px solid #566c86;padding:4px 4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;color:var(--mute);font:inherit;font-size:11px}
.lookbtn.sel{border-color:var(--gold);color:var(--gold)}
.press{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--gold);text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="back" id="back" hidden>◀ 上一題</button>
    <div class="prog" id="progwrap" hidden></div>
    <span class="step" id="step"></span>
    <button class="music" id="music" aria-label="背景音樂開關">♪ OFF</button>
  </div>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- pixel sprites: each char is a color key ---------- */
const PAL = {k:"#0d0e17",w:"#f4f4f4",g:"#94b0c2",s:"#566c86",y:"#ffcd75",o:"#ef7d57",r:"#b13e53",l:"#a7f070",t:"#38b764",b:"#3b5dc9",c:"#41a6f6",n:"#29366f",d:"#333c57",m:"#5d275d",f:"#ffe9b0"};
const SPR = {
  ballot:[
    "....kkkkkk......",
    "....kwwwwk......",
    "....kwrrwk......",
    "....kwrwrk......",
    "....kwrrwk......",
    "..kkkkwwkkkkkk..",
    "..kccccwwccccck.",
    ".kkkkkkkkkkkkkk.",
    ".kbbbbbbbbbbbbk.",
    ".kbbbbkkkkbbbbk.",
    ".kbbbkwwwwkbbbk.",
    ".kbbbkwyywkbbbk.",
    ".kbbbkwwwwkbbbk.",
    ".kbbbbkkkkbbbbk.",
    ".knnnnnnnnnnnnk.",
    ".kkkkkkkkkkkkkk."],
  mug:[
    "..wwwwwwww....",
    ".wwwwwwwwww...",
    ".kkkkkkkkkk...",
    ".kyyyyyyyyk...",
    ".kyfyyyyyykkk.",
    ".kyfyyyyyyk.k.",
    ".kyyyyyfyyk.k.",
    ".kyyyyyyyyk.k.",
    ".kyfyyyyyykkk.",
    ".kyyyyyfyyk...",
    ".kyyyyyyyyk...",
    ".kkkkkkkkkk..."],
  stamp:[
    "....kkkkk....",
    "....koook....",
    "....koook....",
    "...kkkkkkk...",
    "...krrrrrk...",
    "..kkkkkkkkk..",
    "..kmmmmmmmk..",
    "..kkkkkkkkk..",
    ".............",
    "...rrrrrrr...",
    "..rr..r..rr..",
    "..r.rrrrr.r..",
    "..rr..r..rr..",
    "...rrrrrrr..."],
  mega:[
    "..........kk..",
    "........kkwk..",
    "......kkwwwk..",
    "kkkkkkwwwwwk..",
    "kookkwwwwwwk.y",
    "kookkwwwwwwk..",
    "kookkwwwwwwky.",
    "kkkkkkwwwwwk..",
    "..kk..kkwwwk.y",
    "..kk....kkwk..",
    "..kkk.....kk.."],
  trophy:[
    "..kkkkkkkkkk..",
    "kkkyyyyyyyykkk",
    "kyky fyyyyykyk".replace(" ","y"),
    "kyky fyyyyykyk".replace(" ","y"),
    ".kkyfyyyyyykk.",
    "...kyyyyyyk...",
    "....kyyyyk....",
    ".....kyyk.....",
    ".....kyyk.....",
    "....kkyykk....",
    "...koooooook..".slice(0,14),
    "...kkkkkkkk..."],
  arrow:[
    "k...",
    "kk..",
    "kyk.",
    "kyyk",
    "kyk.",
    "kk..",
    "k..."]
};
function sprite(name, scale, cls){
  const rows = SPR[name], h = rows.length, w = Math.max(...rows.map(r => r.length));
  let rects = "";
  rows.forEach((row,y) => { for (let x = 0; x < row.length; x++) { const c = PAL[row[x]]; if (c) rects += '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+c+'"/>'; } });
  return '<svg class="px '+(cls||"")+'" viewBox="0 0 '+w+' '+h+'" width="'+w*scale+'" height="'+h*scale+'" aria-hidden="true">'+rects+'</svg>';
}
/* skyline per city: simple generic building profiles (height per column) */
const SKY = {
  "台北市":[3,3,5,5,4,4,6,6,9,12,16,16,12,9,6,6,4,4,5,5,7,7,3,3],
  "新北市":[4,4,6,6,6,5,5,7,7,7,9,9,9,6,6,8,8,4,4,6,6,6,3,3],
  "桃園市":[3,3,3,5,5,4,4,4,7,7,6,6,2,2,3,8,8,8,5,5,4,4,3,3],
  "台中市":[3,4,4,6,6,6,8,8,10,10,10,7,7,5,5,9,9,6,6,4,4,4,3,3],
  "台南市":[2,2,4,4,4,6,7,7,6,4,4,3,3,5,5,5,8,9,8,5,5,3,2,2],
  "高雄市":[3,3,5,5,7,7,9,11,13,15,15,13,11,9,7,7,5,5,6,6,4,4,3,3]
};
function skyline(name, scale){

function settle(bets, winners){
  const decided = winners.filter(Boolean).length;
  const rows = bets.filter(b => b.picks.filter(p => p.c !== "不押").length >= 3).map(b => {
    let hit = 0, pen = 0, tix = 0;
    const full = b.picks.every(p => p.c !== "不押");
    b.picks.forEach((p,i) => { if (p.c === "不押" || !winners[i]) return; if (p.c === winners[i]) { hit++; tix += p.n; } else pen += p.n; });
    return {nick:b.nick, hit, pen, tix, god: decided === 6 && full && hit === 6, zero: decided === 6 && full && hit === 0};
  });
  const gods = rows.filter(r => r.god).length;
  rows.forEach(r => { if (r.zero) r.pen += 1; r.toast = gods - (r.god ? 1 : 0); r.drink = Math.max(0, r.pen - r.tix) + r.toast; });
  rows.sort((a,b) => b.hit - a.hit || a.drink - b.drink);
  return {rows, decided, gods};
}

  if (!box) { lobbyRAF = 0; return; }
  const dt = Math.min(0.05, (t - (lastT || t)) / 1000); lastT = t;
  const W = box.clientWidth - 39;
  const n = walkers.length, Z = Math.round(box.clientWidth * 0.68);
  if (n > LABN) { labT += dt; if (labT > 5) { labT = 0; labOff = (labOff + LABN) % n; walkers.forEach(w => w.lab = ((w.k - labOff + n) % n) < LABN); } }
  const me = myNick(), party = t < partyUntil;
  box.classList.toggle("party", party);
  sayT += dt; if (sayT > 2.2) { sayT = 0; const pool = walkers.filter(w => !(w.sayT > 0) && w.jt == null); if (pool.length) { const w = pool[Math.floor(Math.random() * pool.length)]; w.cur = w.say && Math.random() < 0.6 ? w.say : idleLine(w); w.sayT = 3.5; } }
  const choppers = walkers.filter(w => w.zone === "tree").length;
  if (choppers) { chopAcc += dt * choppers * 0.25; if (chopAcc >= 1) { chopAcc = 0; const up = treeS.map((s,i) => i).filter(i => !(treeS[i].down > t)); if (up.length) hitTree(up[Math.floor(Math.random() * up.length)], t); } }
  box.querySelectorAll(".tree").forEach((el, i) => { const s = treeS[i]; if (!s) return; el.classList.toggle("down", s.down > t); el.classList.toggle("shake", s.shake > t); });
  box.querySelectorAll(".walker").forEach(el => {
    const w = walkers[+el.dataset.i]; if (!w) return;
    if (w.jt != null) {
      w.jt += dt; const p = Math.min(1, w.jt / 0.55);
      w.x = w.jx0 + (w.jx1 - w.jx0) * p; w.y = w.jy0 + (w.jy1 - w.jy0) * p; w.hop = -Math.sin(Math.PI * p) * 34;
      el.style.bottom = w.y.toFixed(0) + "px"; el.style.zIndex = w.nick === me ? 999 : 10 + Math.round(600 - w.y);
      if (p >= 1) { w.jt = null; w.hop = 0; w.pause = 1.2; }
    } else if (party) { w.ft += dt; if (w.ft > 0.24) { w.ft = 0; w.frame ^= 1; } w.hop = -Math.round(Math.abs(Math.sin(t / 1000 * Math.PI * (partyStyle === "house" ? 124 : 70) / 60)) * (partyStyle === "house" ? 10 : 16)); }
    else if (w.cheerT > 0) { w.hop = -6; w.frame = 0; }
    else if (w.pause > 0) { w.pause -= dt; w.ft += dt; if (w.ft > 0.18) { w.ft = 0; w.frame ^= 1; w.hop = w.frame ? -3 : 0; } }
    else {
      w.x += w.v * dt;
      const [lo, hi] = zBounds(w.zone, box.clientWidth);
      if (w.x < lo) { w.x = lo; w.v = Math.abs(w.v); }
      if (w.x > hi) { w.x = hi; w.v = -Math.abs(w.v); }
      w.ft += dt; if (w.ft > 0.22) { w.ft = 0; w.frame ^= 1; }
      w.hop = 0;
      if (Math.random() < dt * 0.3) w.pause = 0.8 + Math.random() * 2.5;
      if (Math.random() < dt * 0.08) w.v = -w.v;
    }
    if (w.tap > 0) w.tap -= dt;
    if (w.cheerT > 0) w.cheerT -= dt; if (w.sayT > 0) w.sayT -= dt;
    const sb = el.querySelector(".say"); if (sb) { const txt = w.cheerT > 0 ? "🍻 乾杯！" : (w.sayT > 0 ? (w.cur || w.say) : ""); if (sb.textContent !== txt) sb.textContent = txt; sb.className = w.cheerT > 0 ? "say ch" : "say"; sb.style.display = txt ? "" : "none"; if (txt) sb.style.transform = w.x < 50 ? "translateX(-15%)" : (w.x > W - 50 ? "translateX(-85%)" : ""); }
    const nm = el.querySelector(".nm"); if (nm) { const sh = w.lab || w.tap > 0 || w.nick === me; if ((nm.style.display !== "none") !== sh) nm.style.display = sh ? "" : "none"; }
    el.style.transform = "translate(" + w.x.toFixed(1) + "px," + w.hop + "px)";
    el.querySelector(".fa").style.display = w.frame ? "none" : "";
    el.querySelector(".fb").style.display = w.frame ? "" : "none";
    const svgs = el.querySelectorAll("svg"); svgs.forEach(sv => sv.style.transform = w.v < 0 ? "scaleX(-1)" : "");
    const pf = el.querySelector(".puff"); if (pf) pf.style.left = w.v < 0 ? "0px" : "36px";
  });
  lobbyRAF = requestAnimationFrame(tickLobby);
}
document.addEventListener("click", e => {
  if (!e.target.closest) return;
  const cow = e.target.closest("#lobby .cow");
  if (cow) { sfx("moo"); const b = document.createElement("span"); b.className = "moo"; b.textContent = "哞～"; b.style.right = cow.style.right || getComputedStyle(cow).right; b.style.bottom = (parseInt(getComputedStyle(cow).bottom) + 30) + "px"; cow.parentNode.appendChild(b); setTimeout(() => b.remove(), 1400); return; }
  const tr = e.target.closest("#lobby .tree");
  if (tr) { const i = [...document.querySelectorAll("#lobby .tree")].indexOf(tr); hitTree(i, performance.now(), true); return; }
  const el = e.target.closest("#lobby .walker");
  if (el && el.classList.contains("me")) { editSay(); return; }
  if (el) { const w = walkers[+el.dataset.i]; if (!w) return; w.tap = 4; const mw = walkers.find(v => v.nick === myNick());
    if (mw) { if (w.cheerT > 0) return; w.cheerT = 1.6; mw.cheerT = 1.6; w.cheers = (w.cheers || 0) + 1; sfx("coin");
      fetch(API, {method:"POST", credentials:"omit", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({action:"cheer", key: deviceKey(), to: w.nick})}).catch(() => {}); }
    return; }
  const box = e.target.closest("#lobby"); if (!box) return;
  const me = myNick(), w = walkers.find(v => v.nick === me);
  if (!w) { toast("送出預測後，你的角色才會進舞池"); return; }
  const r = box.getBoundingClientRect(), W = box.clientWidth - 39, Z = Math.round(box.clientWidth * 0.68);
  const cx = e.clientX - r.left - 19, cy = r.bottom - e.clientY - 20;
  if (cy + 20 >= box.clientHeight - 170 && cx + 19 >= Z) {
    partyUntil = performance.now() + 30000; pstep = 0; partyStyle = "house";
    if (musicOn && ensureAudio()) {
      if (!djAudio) { djAudio = new Audio("dj.mp3"); djAudio.preload = "auto"; djAudio.onended = () => { partyUntil = 0; if (musicOn) startMusic(); }; }
      try { djAudio.currentTime = 0; } catch (_) {}
      stopMusic();
      djAudio.play().catch(() => { startMusic(); });
    }
    toast(musicOn ? "🎧 DJ：放歌！全場跳起來！" : "🎧 全場跳起來！打開右上角 ♪ 才聽得到 DJ 的歌");
    return; }
  const zone = cy + 20 < YARD ? (cx + 19 < box.clientWidth / 2 ? "tree" : "milk") : (cx + 19 >= Z ? "smoke" : null);
  const b = zBounds(zone, box.clientWidth), yb = zY2(zone);
  w.jx0 = w.x; w.jy0 = w.y; w.jx1 = Math.max(b[0], Math.min(b[1], cx)); w.jy1 = Math.max(yb[0], Math.min(yb[1], cy)); w.jt = 0;
  if (zone !== w.zone) {
    w.zone = zone; store("pred_zone", zone || ""); sfx("coin");
    fetch(API, {method:"POST", credentials:"omit", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({action:"zone", key: deviceKey(), z: zone || ""})}).catch(() => {});
    toast(zone ? ZMSG[zone] : "🍺 回舞池喝酒");
    box.outerHTML = lobbyHTML();
  }
});
setInterval(async () => {
  if (q !== -1 || document.hidden) return;
  try { const r = await fetch(API, {credentials:"omit"}); const j = await r.json(); if (j && Array.isArray(j.nicks)) { info = j; data = j; syncWalkers(); const lb = $("lobby"); if (lb) lb.outerHTML = lobbyHTML(); } } catch (_) {}
}, 30000);
const SAY_PRESETS = ["我賭三杯！", "今晚不醉不歸", "投票了沒？", "理性討論 感性喝酒", "開票見真章", "神預言就是我", "我只是來跳舞的", "乾了這杯！"];
const treeS = [0,1,2].map(() => ({hp: 6, down: 0, shake: 0}));
let chopAcc = 0;
function hitTree(i, t, manual){
  const s = treeS[i]; if (!s || s.down > t) return;
  s.hp--; s.shake = t + 250; if (manual) sfx("chop");
  if (s.hp <= 0) { s.down = t + 20000; s.hp = 6; if (manual) { sfx("fall"); toast("🌲 碰！一棵樹倒了"); } }
}
const IDLE = {
  all: ["好熱", "我沒醉", "廁所在哪", "明天請假", "誰的外套？", "手機剩3%", "我只喝一杯", "誰叫我？", "好餓", "鹹酥雞！", "你押誰？", "開票了沒", "宵夜走起", "我錢包呢？", "好想睡leh", "walao 好嗨", "老闆加點", "我是誰我在哪", "再一杯就好", "我鞋子呢", "浪子踢球", "閃身步", "狗熊多手毛"],
  "": ["安可！", "這首神曲", "DJ 再一首", "腳打結了", "我有在跳嗎"],
  smoke: ["借火？", "最後一根", "明天戒"],
  tree: ["好硬…", "手好痠", "我是樵夫"],
  milk: ["鮮乳讚", "喝了會長高", "牛好可愛"]
};
function idleLine(w){ const z = IDLE[w.zone || ""] || [], a = Math.random() < 0.35 && z.length ? z : IDLE.all; return a[Math.floor(Math.random() * a.length)]; }
function editSay(){
  const mw = walkers.find(v => v.nick === myNick()); if (!mw) return;
  const d = document.createElement("div"); d.className = "sayed";
  d.innerHTML = '<div><p>💬 我的口號（10 字內）<br><small>會在舞池裡從你頭上冒出來</small></p><div class="chips">' + SAY_PRESETS.map(p => '<button class="chip">' + p + '</button>').join("") + '</div><p><small>或自己寫：</small></p><input maxlength="10" value="' + esc(mw.say || "") + '" placeholder="自己寫，10 字內"><p><button class="go ok">儲存</button> <button class="go ghost no">取消</button></p></div>';
  document.body.appendChild(d); const inp = d.querySelector("input");
  d.querySelectorAll(".chip").forEach(b => b.onclick = () => { inp.value = b.textContent; d.querySelectorAll(".chip").forEach(x => x.classList.toggle("sel", x === b)); });
  d.querySelector(".no").onclick = () => d.remove();
  d.querySelector(".ok").onclick = async () => {
    const v = inp.value.trim().slice(0, 10);
    try { const r = await fetch(API, {method:"POST", credentials:"omit", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({action:"say", key: deviceKey(), s: v})}); const j = await r.json();
      if (j.ok) { mw.say = v; mw.cur = v; mw.sayT = v ? 4 : 0; toast(v ? "💬 口號已更新" : "已清除口號"); d.remove(); } else toast(j.error || "沒存成功，你要先送出過預測"); }
    catch (_) { toast("連線失敗，再試一次"); }
  };
}
function startLobby(){ if (!lobbyRAF) { lastT = 0; lobbyRAF = requestAnimationFrame(tickLobby); } }
function toast(s){ const el = $("toast"); el.textContent = s; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }

document.addEventListener("click", e => {
  const b = e.target.closest(".opt");
  if (!b || q < 0 || q >= TOTAL) return;
  const ci = Math.floor(q / 2);
  if (b.dataset.c) { picks[ci].c = b.dataset.c; if (b.dataset.c === "不押") picks[ci].n = null; }
  else picks[ci].n = Number(b.dataset.n);
  b.classList.add("sel");
  sfx("coin");
  setTimeout(() => go(Math.min(nextAfter(q), TOTAL)), 180);
});
$("back").onclick = () => { q = history.length ? history.pop() : -1; if (q === BOARD && !data) loadBoard(); render(); };
render();
setMusicBtn();
loadInfo();
</script>
